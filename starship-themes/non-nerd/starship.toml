# ~/.config/starship.toml

format = '''
$username$hostname $directory$git_branch$golang$python$terraform$kubernetes$time$character
'''

add_newline = false

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
style = "bold blue"
#read_only = ":read_only"
#read_only_style = "bold yellow"
truncation_symbol = "…/"

[git_branch]
format = '[git:(\([$branch](bold fg:#B70404)\))(\([$remote_branch](bold red)\))](bold fg:#E65C19) '

[hostname]
format = "[@$hostname]($style)"
ssh_only = true
style = "bold green"

[username]
disabled = false
format = "[$user]($style)"
show_always = true
style_user = "bold green"
style_root = "bold red"

[python]
symbol = 'py '

[time]
disabled = false
style = "bold cyan"

